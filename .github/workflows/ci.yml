name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract with German language pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu

      - name: Install Python dependencies
        run: |
          pip install -e .
          pip install pytest ruff reportlab

      - name: Lint — ruff check src/
        run: ruff check src/

      - name: Test — pytest
        run: pytest -v
