[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "0.1.0"
description = "Automated document OCR, classification, date extraction, and archiving pipeline"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "streamlit>=1.35",
]

[project.scripts]
doc-pipeline = "doc_pipeline.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rag = ["sentence-transformers>=2.7", "chromadb>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so a newer ruff can't add surprise rules and break CI.
# Core correctness (E/F), import order (I), and modernization (UP).
# Opinionated style rules (blind-except BLE001, try-except-pass S110,
# naive-datetime DTZ005) are intentionally off: this local I/O pipeline
# deliberately swallows non-fatal errors and uses naive timestamps in the UI.
select = ["E4", "E7", "E9", "F", "I", "UP"]
