[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "0.1.0"
description = "Automated document OCR, classification, date extraction, and archiving pipeline"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "streamlit>=1.35",
]

[project.scripts]
doc-pipeline = "doc_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]
